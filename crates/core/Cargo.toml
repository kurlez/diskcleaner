[package]
name = "diskclean-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.7"
ntfs = "0.4.0"
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "disk"] }
trash = "5.2.9"

[dev-dependencies]
encoding_rs = "0.8.44"
flate2 = "1.1.10"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_RestartManager", "Win32_Storage_FileSystem", "Win32_Globalization"] }
winreg = "0.56.0"
